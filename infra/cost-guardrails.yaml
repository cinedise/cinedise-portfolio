AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Cinedise zero-spend budget - emails as soon as actual monthly spend goes over
  $0.01 or is forecast to. Deploy in us-east-1 (AWS Budgets is global, managed there).

Parameters:
  AlertEmail:
    Type: String
    Default: cinedisestudio@gmail.com

Resources:
  ZeroSpendBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: cinedise-zero-spend
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 0.01
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
