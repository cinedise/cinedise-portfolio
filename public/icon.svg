<svg xmlns="http://www.w3.org/2000/svg" viewBox="390 390 300 300">
  <!--
    The Cinedise logomark, cropped from
    `public/logo/logomark/render/svg/cinedise-logomark-dark.svg`. That file
    declares `viewBox="0 0 1080 1080"` but its ink occupies only 280x270 of
    that board, which at favicon sizes would render as a speck. The box here
    is the ink bounds (400,405 280x270) padded out to a centred 300x300
    square. Path data is unchanged from the source.

    Ink follows the browser's colour scheme rather than being fixed, since a
    tab strip is dark in dark mode and light in light mode — a single-colour
    mark would disappear into one of them.
  -->
  <style>
    path { fill: #000; }
    @media (prefers-color-scheme: dark) {
      path { fill: #fff; }
    }
  </style>
